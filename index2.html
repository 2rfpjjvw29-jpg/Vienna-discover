<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meine Wien-Karte</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:14px/1.35 system-ui,sans-serif;color:#222}
#app{display:flex;height:100%}
#side{width:340px;max-width:100%;display:flex;flex-direction:column;border-right:1px solid #ddd;background:#fafafa}
#map{flex:1}
header{padding:10px 12px;border-bottom:1px solid #ddd;background:#fff}
h1{font-size:17px;margin:0 0 6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font:inherit;padding:5px 9px;border:1px solid #bbb;background:#fff;border-radius:6px;cursor:pointer}
button:hover{background:#eee}
button.pri{background:#1a73e8;color:#fff;border-color:#1a73e8}
#status{font-size:12px;color:#666;margin-top:6px;min-height:16px}
#list{flex:1;overflow:auto;padding:4px 0 20px}
.cat{padding:8px 12px 4px;font-weight:600;display:flex;align-items:center;gap:6px;position:sticky;top:0;background:#fafafa}
.dot{width:12px;height:12px;border-radius:50%}
.it{display:flex;align-items:center;gap:6px;padding:4px 12px;cursor:pointer}
.it:hover{background:#eef3fc}
.it .t{flex:1;min-width:0}
.it .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .a{font-size:12px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.done .n{text-decoration:line-through;color:#888}
.it.miss .a{color:#c0392b}
.it button{padding:1px 6px;border:0;background:none}
.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px #0006;display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);font-size:14px}
.pin.done{opacity:.45}
.u{width:20px;height:20px;border-radius:4px;background:#e3000f;color:#fff;font:700 12px/20px system-ui;text-align:center;border:1.5px solid #fff;box-shadow:0 0 3px #0008}
.ul{display:none;position:absolute;left:24px;top:2px;font:600 11px system-ui;color:#900;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.hi .ul{display:block}
dialog{border:1px solid #999;border-radius:10px;padding:16px;width:min(360px,92vw)}
dialog label{display:block;margin:8px 0 2px;font-size:12px;color:#555}
dialog input,dialog select{width:100%;font:inherit;padding:6px;border:1px solid #bbb;border-radius:6px}
.pop b{font-size:14px}
.pop .row{margin-top:6px}
@media(max-width:700px){#app{flex-direction:column-reverse}#side{width:100%;height:42%;border-right:0;border-top:1px solid #ddd}}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header>
      <h1>📍 Meine Wien-Karte</h1>
      <div class="row">
        <button class="pri" id="add">+ Ort hinzufügen</button>
        <label><input type="checkbox" id="ub" checked> U-Bahn</label>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="exp">Export</button>
        <button id="imp">Import</button>
        <button id="rst">Zurücksetzen</button>
        <input type="file" id="file" accept=".json" hidden>
      </div>
      <div id="status"></div>
    </header>
    <div id="list"></div>
  </div>
  <div id="map"></div>
</div>

<dialog id="dlg">
  <form method="dialog" id="frm">
    <h3 id="dt" style="margin:0 0 4px">Ort</h3>
    <label>Name</label><input id="fn" required>
    <label>Adresse (Straße Nr., PLZ Ort)</label><input id="fa" required>
    <label>Kategorie</label><select id="fc"></select>
    <div class="row" style="margin-top:14px;justify-content:flex-end">
      <button type="button" id="cx">Abbrechen</button>
      <button class="pri" id="ok" value="ok">Speichern</button>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const CATS={
  rest:{n:'Restaurants',c:'#e4572e',i:'🍴'},
  gym:{n:'Gyms & Supplemente',c:'#2a7de1',i:'🏋️'},
  shop:{n:'Einkaufen',c:'#2e9e5b',i:'🛒'},
  sight:{n:'Sehenswürdigkeiten',c:'#8e44ad',i:'🏛️'}
};
// [Kategorie, Name, Adresse, erledigt]
const DEFAULTS=[
['rest','Bashly WU','Welthandelsplatz 1, 1020 Wien'],
['rest','Lima 56 (peruanisch)','Favoritenstraße 56, 1040 Wien'],
['rest','Spaghetteria 2.0','Vorgartenstraße 204, 1020 Wien'],
['rest','Mats Würstelstand','Franzensbrückenstraße 2f, 1020 Wien'],
['rest','Baumkuchen Prater','Prater 84, 1020 Wien'],
['rest','Schweizerhaus','Prater 116, 1020 Wien'],
['rest','Taverne Kreta (Gyros)','Wattgasse 71, 1170 Wien'],
['rest','Kolarik Bio','Prater 128, 1020 Wien'],
['rest','Joseph Brot','Führichgasse 6, 1010 Wien'],
['rest','Prindl','Jägerstraße 2, 1200 Wien'],
['rest','Tichy Eis','Reumannplatz 13, 1100 Wien'],
['rest','Zanoni & Zanoni','Lugeck 7, 1010 Wien'],
['rest','Otto will Mehr','Obere Donaustraße 26, 1020 Wien'],
['rest','Naschmarkt','Rechte Wienzeile 35, 1040 Wien'],
['rest','Café Sperl','Gumpendorfer Straße 11, 1060 Wien'],
['rest','Café Schwarzenberg','Kärntner Ring 17, 1010 Wien'],
['rest','XO Burger','Riemergasse 1, 1010 Wien'],
['rest','Trzesniewski','Dorotheergasse 1, 1010 Wien'],
['rest','Neni (israelisch)','Perspektivstraße 8, 1020 Wien'],
['rest','Cucina Itameshi','Praterstraße 70, 1020 Wien'],
['rest','Woa','Graben 29a, 1010 Wien'],
['rest','Brasserie Palmenhaus','Josefsplatz 1, 1010 Wien'],
['rest','Das Loft','Prater 1, 1020 Wien'],
['rest','Fleischerei Hödl (Pastrami)','Breitenfurter Straße 294a, 1230 Wien'],
['rest','Summer (irakisch, Grillplatte)','Davidgasse 17, 1100 Wien'],
['rest','Al Shami (Shawarma)','Brunnenmarkt, 1160 Wien'],
['rest','Alice (römische Pizza)','Donauzentrum, 1220 Wien'],
['rest',"Heindl's Schmarren & Palatschinken",'Grashofgasse 4, 1010 Wien'],
['gym','John Reed','Schottengasse 6-8, 1010 Wien'],
['gym','Fitness First','Schnirchgasse 13, 1030 Wien'],
['gym','Topbody G','Drei-Platz 1, 2201 Gerasdorf bei Wien'],
['gym','Sportnahrung 4 Friends','Lassallestraße 30, 1020 Wien'],
['gym','Prominomax','Mariahilfer Straße 88a, 1070 Wien'],
['gym','Biotech','Landstraßer Hauptstraße 1B, 1030 Wien'],
['gym','GymBeam','Kärntner Ring 1, 1010 Wien'],
['gym','Das Gym','Handelskai 340, 1020 Wien',true],
['shop','Lidl','Heinestraße 24-28, 1020 Wien'],
['shop','Nakwon','Rotensterngasse 31, 1020 Wien'],
['shop','Nakwon','Zieglergasse 12, 1070 Wien'],
['shop','Billa (6–22 Uhr)','Praterstern, 1020 Wien'],
['shop','Gewürz & Co (Stand 325)','Naschmarkt, Rechte Wienzeile, 1040 Wien'],
['sight','Motel One Wien Prater','Ausstellungsstraße 40, 1020 Wien'],
['sight','Flaktürme und Augarten','Augarten, 1020 Wien'],
['sight','Haus des Meeres','Fritz-Grünbaum-Platz 1, 1060 Wien'],
['sight','Palais Ferstl','Herrengasse 14, 1010 Wien'],
['sight','Votivkirche','Rooseveltplatz 8, 1090 Wien'],
['sight','Oberlaa Park','Kurpark Oberlaa, 1100 Wien'],
['sight','Heeresgeschichtliches Museum','Arsenal Objekt 1, 1030 Wien'],
['sight','Paternoster-Aufzug','Felderstraße 1, 1010 Wien'],
['sight','Palais Equitable','Stock-im-Eisen-Platz 3, 1010 Wien'],
['sight','Palais Justiz (5. Stock)','Museumstraße 11, 1010 Wien'],
['sight','Palais Kinsky','Freyung 4, 1010 Wien']
];

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const store={
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const fresh=()=>DEFAULTS.map((p,i)=>({id:'p'+i,cat:p[0],name:p[1],addr:p[2],done:!!p[3]}));
let places=store.get('wienKarte.places',null)||fresh();
let geo=store.get('wienKarte.geo',{});   // Adresse -> [lat,lon] | null
let editId=null,busy=false,cache={};

// ---- Karte ----
const map=L.map('map',{zoomControl:true}).setView([48.2082,16.3738],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
const pl=L.layerGroup().addTo(map), ul=L.layerGroup().addTo(map);
const markers={};
const zc=()=>map.getContainer().classList.toggle('hi',map.getZoom()>=14);
map.on('zoomend',zc);zc();

const save=()=>{store.set('wienKarte.places',places);store.set('wienKarte.geo',geo)};
const hidden=store.get('wienKarte.hidden',{});

function render(){
  pl.clearLayers();Object.keys(markers).forEach(k=>delete markers[k]);
  let html='';
  for(const k in CATS){
    const c=CATS[k],items=places.filter(p=>p.cat===k);
    html+=`<div class="cat"><input type="checkbox" data-cat="${k}" ${hidden[k]?'':'checked'} title="Auf Karte anzeigen">
      <span class="dot" style="background:${c.c}"></span>${c.n} (${items.length})</div>`;
    for(const p of items){
      const g=geo[p.addr];
      html+=`<div class="it ${p.done?'done':''} ${g?'':'miss'}" data-id="${p.id}">
        <input type="checkbox" data-done="${p.id}" ${p.done?'checked':''} title="Erledigt">
        <div class="t"><div class="n">${esc(p.name)}</div><div class="a">${esc(p.addr)}${g?'':' – noch nicht gefunden'}</div></div>
        <button data-edit="${p.id}" title="Bearbeiten">✎</button>
        <button data-del="${p.id}" title="Löschen">🗑</button></div>`;
      if(g&&!hidden[k]) addMarker(p,g);
    }
  }
  $('list').innerHTML=html;
}

function addMarker(p,g){
  const c=CATS[p.cat];
  const icon=L.divIcon({className:'',iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-26],
    html:`<div class="pin ${p.done?'done':''}" style="background:${c.c}"><span>${c.i}</span></div>`});
  const m=L.marker(g,{icon,draggable:true,title:p.name}).addTo(pl);
  m.bindPopup(()=>`<div class="pop"><b>${esc(p.name)}</b><br>${esc(p.addr)}
    <div class="row"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+', '+p.addr)}">Google Maps</a></div>
    <div class="row"><button onclick="edit('${p.id}')">✎ Bearbeiten</button><button onclick="del('${p.id}')">🗑 Löschen</button></div>
    <div style="font-size:11px;color:#888;margin-top:4px">Pin ziehen = Position korrigieren</div></div>`);
  m.on('dragend',()=>{const ll=m.getLatLng();geo[p.addr]=[ll.lat,ll.lng];save()});
  markers[p.id]=m;
}

// ---- Geocoding (Nominatim, 1 Anfrage/Sekunde) ----
async function nominatim(q){
  const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=at&accept-language=de'
    +'&viewbox=16.18,48.33,16.58,48.10&q='+encodeURIComponent(q);
  const r=await fetch(u);if(!r.ok)throw new Error(r.status);
  const j=await r.json();return j[0]?[+j[0].lat,+j[0].lon]:null;
}
async function geocodeAll(){
  if(busy)return;busy=true;
  const todo=places.filter(p=>!(p.addr in geo));
  let n=0;
  for(const p of todo){
    if(p.addr in geo)continue;
    $('status').textContent=`Standorte werden gesucht … ${++n}/${todo.length}`;
    try{
      let g=await nominatim(p.addr);
      if(!g){await sleep(1100);g=await nominatim(p.name+', Wien')}
      geo[p.addr]=g;save();render();
    }catch(e){$('status').textContent='Suche fehlgeschlagen (Netzwerk/Limit) – Seite später neu laden.';busy=false;return}
    await sleep(1100);
  }
  busy=false;
  const miss=places.filter(p=>!geo[p.addr]).length;
  $('status').textContent=miss?`${miss} Adresse(n) nicht gefunden – bitte Adresse korrigieren.`:'Alle Standorte gefunden ✓';
}

// ---- U-Bahn (OpenStreetMap / Overpass) ----
async function loadUbahn(){
  let st=store.get('wienKarte.ubahn',null);
  if(!st){
    const q='[out:json][timeout:25];(node["station"="subway"](48.10,16.20,48.35,16.56);node["railway"="station"]["subway"="yes"](48.10,16.20,48.35,16.56););out;';
    try{
      const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));
      const j=await r.json(),seen={};
      st=j.elements.filter(e=>e.tags&&e.tags.name&&!seen[e.tags.name+Math.round(e.lat*200)+Math.round(e.lon*200)]
        &&(seen[e.tags.name+Math.round(e.lat*200)+Math.round(e.lon*200)]=1))
        .map(e=>[e.tags.name,e.lat,e.lon]);
      if(st.length)store.set('wienKarte.ubahn',st);
    }catch(e){$('status').textContent='U-Bahn-Stationen konnten nicht geladen werden.';return}
  }
  ul.clearLayers();
  for(const [n,la,lo] of st){
    L.marker([la,lo],{zIndexOffset:-500,title:n,icon:L.divIcon({className:'',iconSize:[20,20],iconAnchor:[10,10],
      html:`<div class="u">U</div><span class="ul">${esc(n)}</span>`})}).addTo(ul);
  }
}
$('ub').onchange=e=>e.target.checked?map.addLayer(ul):map.removeLayer(ul);

// ---- Bearbeiten ----
$('fc').innerHTML=Object.entries(CATS).map(([k,c])=>`<option value="${k}">${c.n}</option>`).join('');
function openDlg(p){
  editId=p?p.id:null;
  $('dt').textContent=p?'Ort bearbeiten':'Ort hinzufügen';
  $('fn').value=p?p.name:'';$('fa').value=p?p.addr:'';$('fc').value=p?p.cat:'rest';
  $('dlg').showModal();
}
window.edit=id=>{map.closePopup();openDlg(places.find(p=>p.id===id))};
window.del=id=>{
  const p=places.find(x=>x.id===id);
  if(p&&confirm(`„${p.name}“ löschen?`)){map.closePopup();places=places.filter(x=>x.id!==id);save();render()}
};
$('add').onclick=()=>openDlg(null);
$('cx').onclick=()=>$('dlg').close();
$('frm').onsubmit=e=>{
  const name=$('fn').value.trim(),addr=$('fa').value.trim(),cat=$('fc').value;
  if(!name||!addr)return;
  if(editId){Object.assign(places.find(p=>p.id===editId),{name,addr,cat})}
  else places.push({id:'p'+Date.now(),cat,name,addr,done:false});
  save();render();geocodeAll();
};

// ---- Liste: Klicks ----
$('list').onclick=e=>{
  const t=e.target;
  if(t.dataset.cat){hidden[t.dataset.cat]=!t.checked;store.set('wienKarte.hidden',hidden);render();return}
  if(t.dataset.done){const p=places.find(x=>x.id===t.dataset.done);p.done=t.checked;save();render();return}
  if(t.dataset.edit)return edit(t.dataset.edit);
  if(t.dataset.del)return del(t.dataset.del);
  const it=t.closest('.it');if(!it)return;
  const m=markers[it.dataset.id];
  if(m){map.setView(m.getLatLng(),Math.max(map.getZoom(),16));m.openPopup()}
};

// ---- Export / Import / Reset ----
$('exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({places,geo},null,1)],{type:'application/json'}));
  a.download='wien-karte.json';a.click();
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  try{
    const j=JSON.parse(await e.target.files[0].text());
    if(!Array.isArray(j.places))throw 0;
    places=j.places;geo=j.geo||{};save();render();geocodeAll();
  }catch(err){alert('Datei ungültig.')}
  e.target.value='';
};
$('rst').onclick=()=>{
  if(confirm('Alle Änderungen verwerfen und Ausgangsliste wiederherstellen?')){places=fresh();save();render();geocodeAll()}
};

render();loadUbahn();geocodeAll();
</script>
</body>
</html>
